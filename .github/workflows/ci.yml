name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Knowledge health
        run: npm run knowledge:health

      - name: Check Obsidian Workbench plugin syntax
        run: node --check content/.obsidian/plugins/knowledge-workbench/main.js

      - name: Build
        run: npm run build
